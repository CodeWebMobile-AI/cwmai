version: '3.8'

services:
  cwmai:
    build: .
    image: cwmai:latest
    container_name: cwmai-app
    environment:
      # Load from .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://localhost:6379
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    stdin_open: true
    tty: true
    command: python cwmai

  cwmai-continuous:
    build: .
    image: cwmai:latest
    container_name: cwmai-continuous
    environment:
      # Load from .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://localhost:6379
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: python run_continuous_ai.py
    restart: unless-stopped